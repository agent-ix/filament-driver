[package]
name = "fsl-cli"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.1"
description = "The user-facing fsl command-line application."
authors = ["Agent IX <agent@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false

[[bin]]
name = "fsl"
path = "src/main.rs"

[features]
# Opt-in TC-018 seam; it is absent from default features and only active in
# builds with debug assertions. Other builds reject explicit feature selection.
tc018-test-adapter = []

[dependencies]
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", branch = "main" }
base64 = "=0.23.1"
fsl-command = { git = "https://github.com/agent-ix/filament-spec-language", branch = "fsl-rename" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", branch = "fsl-rename" }
fsl-cst = { git = "https://github.com/agent-ix/filament-spec-language", branch = "fsl-rename" }
fsl-package = { git = "https://github.com/agent-ix/filament-spec-language", branch = "fsl-rename" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", branch = "fsl-rename" }
fsl-route = { git = "https://github.com/agent-ix/filament-spec-language", branch = "fsl-rename" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", branch = "fsl-rename" }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
# IR-609 composes the user-facing CLI with its separately bounded cache.
filament-cache = { path = "../filament-cache" }
filament-driver = { path = ".." }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", branch = "main" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", branch = "main", features = ["serde_json"] }
filament-plugin-host = { path = "../filament-plugin-host" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
serde_path_to_error = "=0.1.20"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "=0.4.6"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
libc = "=0.2.190"
quire-contract-codegen = { git = "https://github.com/agent-ix/filament-contract-codegen", branch = "main" }
filament-contract-model = { git = "https://github.com/agent-ix/filament-contract-ir", branch = "main" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", branch = "fsl-rename" }
regex = "=1.13.1"

[lints]
workspace = true
