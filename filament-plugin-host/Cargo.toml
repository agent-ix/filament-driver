[package]
name = "filament-plugin-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Canonical framing and process boundary for filament driver plugins."
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false

[features]
test-support = ["dep:fsl-test-provider"]

[dependencies]
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", features = ["serde_json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
filament-exact = { version = "0.3.0", git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616" }
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
fsl-test-provider = { path = "../fsl-test-provider", optional = true }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["feature"] }
rlimit = "=0.11.0"

[[bin]]
name = "fsl-plugin-launch"
path = "src/launch.rs"

[[bin]]
name = "fsl-resource-test-provider"
path = "tests/fixtures/resource_provider.rs"
required-features = ["test-support"]

[lints]
workspace = true
