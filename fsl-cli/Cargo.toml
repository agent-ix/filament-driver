[package]
name = "fsl-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"
description = "The user-facing fsl command-line application."
authors = ["Agent IX <agent@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false

[[bin]]
name = "fsl"
path = "src/main.rs"

[features]
# Opt-in TC-018 seam; it is absent from default features and only active in
# builds with debug assertions. Other builds reject explicit feature selection.
tc018-test-adapter = []

[dependencies]
filament-semantic-value = { version = "0.1.5", git = "https://github.com/agent-ix/filament-semantic-value", rev = "689f259eab592b62cb362f5e649dba16adf874f7" }
base64 = "=0.23.1"
fsl-analyze = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02" }
fsl-command = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02", features = ["quire-extraction"] }
fsl-inspect = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02" }
fsl-cst = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02" }
fsl-package = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02", features = ["quire-extraction"] }
fsl-route = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02" }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
# IR-609 composes the user-facing CLI with its separately bounded cache.
filament-cache = { path = "../filament-cache" }
filament-driver = { path = ".." }
filament-exact = { version = "0.3.0", git = "https://github.com/agent-ix/filament-exact", rev = "08a5a1763ef4bd1ea7d1147717c959af5a3522cc" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.2", features = ["serde_json"] }
filament-plugin-host = { path = "../filament-plugin-host" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
thiserror = "=2.0.20"
serde_path_to_error = "=0.1.20"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "=0.4.6"

[dev-dependencies]
tempfile = "=3.27.0"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
libc = "=0.2.190"
filament-contract-codegen = { git = "https://github.com/agent-ix/filament-contract-codegen", rev = "a76344b75faa110e843d9e4e48ebd90ba326ddbb" }
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "4f0b908a5c8077458e4748509284704b9025493f" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "dccaf11c3d00f51738761f26cb72ef3124415e02" }
regex = "=1.13.1"

[lints]
workspace = true
