[package]
name = "filament-cache"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Content-addressed cache boundary for filament-driver provider results."
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false

[dependencies]
filament-driver = { path = ".." }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", features = ["serde_json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[dev-dependencies]
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[lints]
workspace = true
