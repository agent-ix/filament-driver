[package]
name = "fsl-cli-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
publish = false

# This test-only workspace never resolves or builds the driver's product graph.
[workspace]
resolver = "2"

[dependencies]
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
rustix = { version = "1.1.6", features = ["fs", "event", "process"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"
