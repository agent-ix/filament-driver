[package]
name = "fsl-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"
description = "The user-facing fsl command-line application."
authors = ["Agent IX <agent@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false

[[bin]]
name = "fsl"
path = "src/main.rs"

[[test]]
name = "fsl-cli-process-fixture"
path = "tests/fixtures/process_plugin.rs"
bench = false
harness = false

[features]
# Opt-in TC-018 seam; it is absent from default features and only active in
# builds with debug assertions. Other builds reject explicit feature selection.
tc018-test-adapter = []

[dependencies]
filament-semantic-value = { version = "0.1.5", git = "https://github.com/agent-ix/filament-semantic-value", rev = "bb9e9053a6b60d5695d0585add616beaee859543" }
base64 = "=0.23.1"
fsl-analyze = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc" }
fsl-command = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc", features = ["quire-extraction"] }
fsl-inspect = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc" }
fsl-cst = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc" }
fsl-package = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc", features = ["quire-extraction"] }
fsl-route = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc" }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
# IR-609 composes the user-facing CLI with its separately bounded cache.
filament-cache = { path = "../filament-cache" }
filament-driver = { path = ".." }
filament-exact = { version = "0.3.0", git = "https://github.com/agent-ix/filament-exact", rev = "743c42e4e458782bf7a8befc3b76cc8a190ed727" }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "quire-canonical-v0.3.3", features = ["serde_json"] }
filament-plugin-host = { path = "../filament-plugin-host" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
thiserror = "=2.0.20"
serde_path_to_error = "=0.1.20"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "=0.4.6"

[dev-dependencies]
tempfile = "=3.27.0"
libc = "=0.2.190"
filament-contract-codegen = { git = "https://github.com/agent-ix/filament-contract-codegen", rev = "af3244ec0fc18536bbd18908aa26d7bd2045ccb5" }
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "4a45e6936141e161535a9af6e6d8d2cb51d7d5b9" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "cb1ea781364a4febf8c87fd715fc82a0d245cabc" }
regex = "=1.13.1"

[lints]
workspace = true
