[package]
name = "fsl-cli"
version = "0.1.4"
edition = "2021"
rust-version = "1.98.1"
description = "The user-facing fsl command-line application."
authors = ["Agent IX <agent@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false

[[bin]]
name = "fsl"
path = "src/main.rs"

# The process provider the `fsl analyze --provider-config` tests start
# (FSL FR-635). It is a test fixture, not part of the `fsl` distribution.
[[bin]]
name = "fsl-test-provider"
path = "tests/support/test_provider.rs"
test = false
doc = false

[features]
# Opt-in TC-018 seam; it is absent from default features and only active in
# builds with debug assertions. Other builds reject explicit feature selection.
tc018-test-adapter = []

[dependencies]
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "1df71c27e6db56c8118cf017689aa7fab6156cde" }
base64 = "=0.23.1"
fsl-analyze = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b" }
fsl-command = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b", features = ["quire-extraction"] }
fsl-inspect = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b" }
fsl-cst = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b" }
fsl-package = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b", features = ["quire-extraction"] }
fsl-route = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b" }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
# IR-609 composes the user-facing CLI with its separately bounded cache.
filament-cache = { path = "../filament-cache" }
filament-driver = { path = ".." }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", features = ["serde_json"] }
filament-plugin-host = { path = "../filament-plugin-host" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
thiserror = "=2.0.20"
serde_path_to_error = "=0.1.20"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "=0.4.6"

[dev-dependencies]
tempfile = "=3.27.0"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
libc = "=0.2.190"
filament-contract-codegen = { git = "https://github.com/agent-ix/filament-contract-codegen", rev = "19934a427d650f657010f5ee27c962679c74d538" }
filament-contract-model = { git = "https://github.com/agent-ix/filament-contract-ir", rev = "c9e52417889db09dcb1abe1015320448139269fb" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "d0c9827eac2837aed32080387a81c23c6557b65b" }
regex = "=1.13.1"

[lints]
workspace = true
