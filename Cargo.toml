[package]
name = "filament-driver"
version = "0.1.4"
edition = "2021"
rust-version = "1.98.1"
description = "Orchestrating driver: calls FSL (compile, emit, route) and CG (negotiate) across repositories (ADR-011 T-13)."
authors = ["Agent IX <agent@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false

[workspace]
members = [
    "filament-cache",
    "fsl-test-provider",
    "fsl-cli",
    "filament-plugin-host",
]
default-members = [
    ".",
    "filament-cache",
    "fsl-test-provider",
    "fsl-cli",
    "filament-plugin-host",
]
# make examples-check fetches filament-examples, with its own runner crate, under target/.
exclude = ["target"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"

[lib]
name = "filament_driver"
path = "src/lib.rs"

# ADR-011 §6.1 driver row: the driver depends on the FSL layer crates, on CG
# and on IR's model crate (the E5 v2 reader and `CheckedNodeId`), and no FSL,
# IR or CG package depends on it. Downstream packages such as `filament-cache`
# may depend on its interface. It is downstream of CG because CG -> FSL
# (`fsl-replay`) is a normal edge and Cargo refuses a package cycle.
#
# Keep the shared first-party crate revisions aligned with merged contract-codegen
# and FSL so their public types resolve to one copy. Cargo.lock records the selected
# commits.
[dependencies]
# Shared diagnostic types are owned by FSV, not re-exported by FSL.
filament-semantic-value = { version = "0.1.5", git = "https://github.com/agent-ix/filament-semantic-value", rev = "31d807ccb8ffd5a88beb0b1a570b80acb099f5e9" }
fsl-analyze = { git = "https://github.com/agent-ix/filament-spec-language", rev = "7713d248be656715cee7ecdac50106991f0158b4" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "7713d248be656715cee7ecdac50106991f0158b4" }
fsl-package = { git = "https://github.com/agent-ix/filament-spec-language", rev = "7713d248be656715cee7ecdac50106991f0158b4" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", rev = "7713d248be656715cee7ecdac50106991f0158b4" }
fsl-route = { git = "https://github.com/agent-ix/filament-spec-language", rev = "7713d248be656715cee7ecdac50106991f0158b4" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "7713d248be656715cee7ecdac50106991f0158b4", features = ["test-support"] }
filament-contract-codegen = { git = "https://github.com/agent-ix/filament-contract-codegen", rev = "6271da1f0d3d48b9a70c4d22df7b2869d3a9d44b" }
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "f0354357b423dfb0f72d373529c3fbcc33516848" }
filament-contract-runtime = { version = "0.1.1", git = "https://github.com/agent-ix/filament-contract-runtime", rev = "3d293e4aaaafe764712141cf5a4ad35693244adb", default-features = false, features = ["exact"] }
# The observation owner issues the progress view in the preparation request.
filament-observation = { version = "0.1.1", git = "https://github.com/agent-ix/filament-observation", rev = "004c7c4f934d15022d2a80b98c451d436109b44b" }
# FSpec FR-331's linked manifest snapshot is canonicalized at registry admission.
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1" }
# FSL's caller-owned cancellation handle is a public driver API type.
filament-exact = { version = "0.3.0", git = "https://github.com/agent-ix/filament-exact", rev = "a58474cc105a86f3307a11def3fc001e2459679f" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "=2.0.20"

[dev-dependencies]
# FR-020-AC-14: `PathGuard::new` and `RequirementRecord::with_path_condition`.
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "7713d248be656715cee7ecdac50106991f0158b4", features = ["test-support"] }
# Existing DeclarationKey fixture follows its extracted plain-value owner.
filament-checked = { git = "https://github.com/agent-ix/filament-eval", rev = "79b8c42b60f43c936e8e50a7fc6519da030c978d" }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }



# The filament-examples gate needs the fetched suite; `make examples-check` runs it.
[[test]]
name = "examples_gate"
path = "tests/examples_gate.rs"
test = false

[profile.release]
lto = "thin"
codegen-units = 1

[lints]
workspace = true

# Profile for the prebuilt release binaries (.github/workflows/release.yml).
# `release` is thin LTO with one codegen unit across the whole git dependency
# graph, which peaks near 6 GB of memory in one rustc process; this trades a
# little run-time speed for a build that fits a 7 GB CI runner.
[profile.dist]
inherits = "release"
lto = false
codegen-units = 16
