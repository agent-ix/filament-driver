[package]
name = "filament-driver"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"
description = "Orchestrating driver: calls FSL (compile, emit, route) and CG (negotiate) across repositories (ADR-011 T-13)."
authors = ["Agent IX <agent@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false
autobins = false

[workspace]
members = [
    "filament-cache",
    "fsl-test-provider",
    "fsl-cli",
    "filament-plugin-host",
]
default-members = [
    ".",
    "filament-cache",
    "fsl-test-provider",
    "fsl-cli",
    "filament-plugin-host",
]
# make examples-check fetches filament-examples, with its own runner crate, under target/.
exclude = ["target"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"

[lib]
name = "filament_driver"
path = "src/lib.rs"

[[bin]]
name = "alpha-journey-gate"
path = "src/bin/alpha_journey_gate.rs"

# ADR-011 §6.1 driver row: the driver depends on the FSL layer crates, on CG
# and on IR's model crate (the E5 v2 reader and `CheckedNodeId`), and no FSL,
# IR or CG package depends on it. Downstream packages such as `filament-cache`
# may depend on its interface. It is downstream of CG because CG -> FSL
# (`fsl-replay`) is a normal edge and Cargo refuses a package cycle.
#
# Keep shared first-party revisions aligned across the FSL and codegen API set so
# public types in the dependency graph resolve to one copy. Cargo.lock records the
# selected commits.
[dependencies]
# Shared diagnostic types are owned by FSV, not re-exported by FSL.
filament-semantic-value = { version = "0.1.5", git = "https://github.com/agent-ix/filament-semantic-value", rev = "bb9e9053a6b60d5695d0585add616beaee859543" }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
fsl-analyze = { git = "https://github.com/agent-ix/filament-spec-language", rev = "c29952a8ed949f33250d004c82233d803068ab22" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "c29952a8ed949f33250d004c82233d803068ab22" }
fsl-package = { git = "https://github.com/agent-ix/filament-spec-language", rev = "c29952a8ed949f33250d004c82233d803068ab22" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", rev = "c29952a8ed949f33250d004c82233d803068ab22" }
fsl-route = { git = "https://github.com/agent-ix/filament-spec-language", rev = "c29952a8ed949f33250d004c82233d803068ab22" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "c29952a8ed949f33250d004c82233d803068ab22" }
filament-contract-codegen = { git = "https://github.com/agent-ix/filament-contract-codegen", rev = "e1c5bd65f5da228bbfc9156bac4f27903ba81766" }
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "4a45e6936141e161535a9af6e6d8d2cb51d7d5b9" }
filament-contract-runtime = { version = "0.1.1", git = "https://github.com/agent-ix/filament-contract-runtime", rev = "e09091f6d6809225d9b73fd221bce6048acb68c3", default-features = false, features = ["exact"] }
# The observation owner issues the progress view in the preparation request.
filament-observation = { version = "0.1.1", git = "https://github.com/agent-ix/filament-observation", rev = "b7929dd9b807ee9291fb4f6b5cf9d15e288a9b45" }
# FSpec FR-331's linked manifest snapshot is canonicalized at registry admission.
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.2" }
# FSL's caller-owned cancellation handle is a public driver API type.
filament-exact = { version = "0.3.0", git = "https://github.com/agent-ix/filament-exact", rev = "743c42e4e458782bf7a8befc3b76cc8a190ed727" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "=2.0.20"

[dev-dependencies]
# FR-020-AC-14: `PathGuard::new` and `RequirementRecord::with_path_condition`.
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "c29952a8ed949f33250d004c82233d803068ab22", features = ["test-support"] }
# Existing DeclarationKey fixture follows its extracted plain-value owner.
filament-checked = { git = "https://github.com/agent-ix/filament-eval", rev = "5d852cedc1daa5295b75df5518b551f83c1cd359" }



# The filament-examples gate needs the fetched suite; `make examples-check` runs it.
[[test]]
name = "examples_gate"
path = "tests/examples_gate.rs"
test = false

[profile.release]
lto = "thin"
codegen-units = 1

[lints]
workspace = true

# Profile for the prebuilt release binaries (.github/workflows/release.yml).
# `release` is thin LTO with one codegen unit across the whole git dependency
# graph, which peaks near 6 GB of memory in one rustc process; this trades a
# little run-time speed for a build that fits a 7 GB CI runner.
[profile.dist]
inherits = "release"
lto = false
codegen-units = 16
