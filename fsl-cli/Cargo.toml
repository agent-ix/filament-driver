[package]
name = "fsl-cli"
version = "0.1.4"
edition = "2021"
rust-version = "1.98.1"
description = "The user-facing fsl command-line application."
authors = ["Agent IX <agent@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-driver"
publish = false

[[bin]]
name = "fsl"
path = "src/main.rs"

[features]
# Opt-in TC-018 seam; it is absent from default features and only active in
# builds with debug assertions. Other builds reject explicit feature selection.
tc018-test-adapter = []

[dependencies]
filament-semantic-value = { version = "0.1.5", git = "https://github.com/agent-ix/filament-semantic-value", rev = "f5c913bd4fc8880b45e02e3918e02360c530320c" }
base64 = "=0.23.1"
fsl-analyze = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
fsl-command = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285", features = ["quire-extraction"] }
fsl-inspect = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
fsl-cst = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
fsl-package = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285", features = ["quire-extraction"] }
fsl-route = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
# IR-609 composes the user-facing CLI with its separately bounded cache.
filament-cache = { path = "../filament-cache" }
filament-driver = { path = ".." }
filament-exact = { version = "0.3.0", git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", features = ["serde_json"] }
filament-plugin-host = { path = "../filament-plugin-host" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
thiserror = "=2.0.20"
serde_path_to_error = "=0.1.20"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "=0.4.6"

[dev-dependencies]
tempfile = "=3.27.0"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
libc = "=0.2.190"
filament-contract-codegen = { git = "https://github.com/agent-ix/filament-contract-codegen", rev = "5f83586524c886c89dd4b538c06580de260859df" }
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "af45a9836e5963398fae414622e4def25faf7043" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", rev = "8f71444d8ae0e786a943c71cb84f9268c07c1285" }
regex = "=1.13.1"

[lints]
workspace = true
